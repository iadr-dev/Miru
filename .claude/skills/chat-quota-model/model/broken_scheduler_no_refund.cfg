\* Broken on purpose: the scheduler before ChatClaim. A job past its daily_limit re-polls and
\* keeps each unit. Shows the lockout only. Must fail RejectOnlyWhenFull (finding F3).
SPECIFICATION Spec
CONSTANTS
    Req = {1, 2}
    Route <- RouteSched
    Key <- KeyNone2
    Cap = 2
    Days = 1
    FailAt = {"daily_limit_check"}
    CrashIn = {}
    RefundMode = "dup_only"
    RefundDay = "now"
    RowLock = TRUE
    UniqueKey = TRUE
    DupRefund = TRUE
    RefundStarted = FALSE
INVARIANTS TypeOK RejectOnlyWhenFull
