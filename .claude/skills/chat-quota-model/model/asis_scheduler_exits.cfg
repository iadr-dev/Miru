\* Code as-is: a scheduled run returns early after quota_gate.allows granted a unit.
SPECIFICATION Spec
CONSTANTS
    Req = {1, 2}
    Route <- RouteSched
    Key <- KeyNone2
    Cap = 1
    Days = 1
    FailAt = {"daily_limit_check", "resolve_inputs", "claim_job"}
    CrashIn = {}
    RefundMode = "as_is"
    RefundDay = "now"
    RowLock = TRUE
    UniqueKey = TRUE
    DupRefund = TRUE
    RefundStarted = FALSE
INVARIANTS TypeOK CapSafety NoLeak RejectOnlyWhenFull OneTurnPerKey
