\* Broken on purpose: a started turn gives its unit back however it ends, an answer
\* delivered included. Must fail CapSafety.
SPECIFICATION Spec
CONSTANTS
    Req = {1, 2, 3}
    Route <- RouteQuery3
    Key <- KeyDup3
    Cap = 1
    Days = 1
    FailAt = {}
    CrashIn = {}
    RefundMode = "pre_start"
    RefundDay = "claim"
    RowLock = TRUE
    UniqueKey = TRUE
    DupRefund = TRUE
    GiveBackOn = {"done", "cancelled", "save_failed", "run_failed"}
    SchedOrder = "check_first"
INVARIANTS TypeOK CapSafety NoLeak RejectOnlyWhenFull OneTurnPerKey
