# config/concept_themes.yaml — the curated seed list of Taiwan-market concept themes the
# operator-triggered research pipeline investigates. Unlike the industry-chain themes (which are
# derived deterministically from FinMind's classification roster), a concept theme is a market
# narrative that cuts across formal industries — so each entry here is only a name plus a scope
# hint; the pipeline researches the actual constituents, and every proposed symbol is filtered
# against the real stored universe before it is ever persisted.
#
# Kept as data, not code, so an editor can add or revise a theme without a deploy. The `key` is
# the natural slug the theme is stored under; `hint` is one Chinese sentence describing the
# theme's scope, and it is what grounds the research prompt — keep it genuinely descriptive.
#
# Format:
#   - key: <slug>
#     name_zh: <中文名稱>
#     name_en: <English name>
#     hint: <一句話描述此概念的範圍與代表性次產業>
- key: cowos-advanced-packaging
  name_zh: CoWoS先進封裝
  name_en: CoWoS Advanced Packaging
  hint: 台積電CoWoS 2.5D/3D先進封裝產業鏈，涵蓋封裝載板、測試介面、封裝設備與矽中介層等相關供應商。
- key: ai-server
  name_zh: AI伺服器
  name_en: AI Server
  hint: 輝達GPU AI伺服器供應鏈，涵蓋伺服器代工組裝、機殼、電源、機櫃與資料中心系統整合廠。
- key: silicon-photonics
  name_zh: 矽光子
  name_en: Silicon Photonics
  hint: 矽光子與共同封裝光學（CPO）技術，涵蓋光收發模組、光引擎、被動光元件與相關材料廠。
- key: hbm-high-bandwidth-memory
  name_zh: HBM高頻寬記憶體
  name_en: HBM High-Bandwidth Memory
  hint: 高頻寬記憶體產業鏈，涵蓋記憶體測試、封裝、探針卡與HBM相關檢測設備供應商。
- key: liquid-cooling
  name_zh: 液冷散熱
  name_en: Liquid Cooling
  hint: 資料中心與AI伺服器液冷散熱方案，涵蓋水冷板、分歧管、快接頭、冷卻液分配單元與散熱模組廠。
- key: heavy-electrical
  name_zh: 重電
  name_en: Heavy Electrical Equipment
  hint: 電網基礎建設與重電設備，涵蓋變壓器、開關設備、電纜、電力系統統包工程廠。
- key: energy-storage
  name_zh: 儲能
  name_en: Energy Storage
  hint: 電網級與商用儲能系統，涵蓋電池模組、儲能變流器（PCS）、能源管理系統與系統整合商。
- key: leo-satellite
  name_zh: 低軌衛星
  name_en: Low-Earth-Orbit Satellite
  hint: 低軌衛星通訊產業鏈，涵蓋地面接收設備、相位陣列天線、衛星零組件與衛星代工組裝廠。
- key: defense-military
  name_zh: 軍工國防
  name_en: Defense & Military
  hint: 國防自主與軍工產業（不含無人機機體/飛控，已獨立為另一主題），涵蓋航太零組件、雷達通訊系統、國艦國造船艦與軍用電子系統供應商。
- key: nvidia-concept
  name_zh: 輝達概念股
  name_en: NVIDIA Concept
  hint: 直接供貨或深度參與輝達GPU與AI平台供應鏈的台廠，涵蓋晶圓代工、封測、伺服器與散熱電源。
- key: apple-concept
  name_zh: 蘋果概念股
  name_en: Apple Concept
  hint: 蘋果iPhone/Mac/穿戴裝置供應鏈台廠，涵蓋組裝代工、鏡頭、機殼、被動元件與晶片相關供應商。
- key: tesla-supply-chain
  name_zh: 特斯拉供應鏈
  name_en: Tesla Supply Chain
  hint: 特斯拉電動車與能源供應鏈台廠，涵蓋車用連接器、充電、電池材料、散熱與車用電子零組件。
- key: drone-uav
  name_zh: 無人機
  name_en: Drone / UAV
  hint: 無人機機體結構與飛控系統供應鏈（獨立於更廣泛的軍工國防主題），涵蓋機身/旋翼結構件、飛控模組、光電酬載鏡頭、地面站通訊與代理商，含商用與軍用無人機廠。
- key: semiconductor-equipment
  name_zh: 半導體設備
  name_en: Semiconductor Equipment
  hint: 半導體前後段製程設備與量測檢測供應鏈（獨立於CoWoS/HBM等特定製程主題），涵蓋濕製程/清洗設備、乾式蝕刻、無塵室工程、探針測試機與設備零組件廠。
- key: cdmo-biotech
  name_zh: 生技CDMO
  name_en: Biotech CDMO
  hint: 生技藥品/生物製劑委託開發暨製造（CDMO）供應鏈，涵蓋原料藥代工、無菌針劑代工、生物製劑量產與併購海外CDMO產能的台廠。
- key: hydrogen-energy
  name_zh: 氫能
  name_en: Hydrogen Energy
  hint: 氫能與燃料電池產業鏈（獨立於既有儲能主題），涵蓋固態氧化物燃料電池（SOFC）、氫氣儲運設備、電解水製氫系統與相關零組件供應商。
- key: ev-charging
  name_zh: 充電樁
  name_en: EV Charging Infrastructure
  hint: 電動車充電基礎設施供應鏈（獨立於既有特斯拉供應鏈主題），涵蓋充電樁本體製造、充電模組、電力轉換器與充電站營運系統整合商。
- key: robotics-automation
  name_zh: 機器人與工業自動化
  name_en: Robotics & Industrial Automation
  hint: 人形機器人與工業自動化產業鏈，涵蓋減速機、伺服馬達、機器人關節/傳動零組件、機械手臂系統整合與精密減速齒輪供應商。
- key: quantum-computing
  name_zh: 量子計算
  name_en: Quantum Computing
  hint: 量子電腦與量子技術產業鏈，涵蓋低溫散熱/低溫封裝設備、精密量測儀器、光學元件與參與量子運算研發的半導體代工廠。
- key: cybersecurity
  name_zh: 資安
  name_en: Cybersecurity
  hint: 資訊安全服務與產品供應鏈，涵蓋端點防護、雲端資安服務、資安顧問/滲透測試與政府關鍵基礎設施資安標案廠商。
- key: gaming-esports
  name_zh: 遊戲電競
  name_en: Gaming & Esports
  hint: 遊戲研發代理與電競周邊硬體供應鏈，涵蓋線上遊戲研發代理商、電競周邊裝置（鍵鼠耳機）與電競賽事營運相關廠商。
- key: medical-aesthetics
  name_zh: 醫美
  name_en: Medical Aesthetics
  hint: 醫學美容產業鏈，涵蓋雷射美容儀器製造、微整形針劑/填充劑、醫美診所集團與跨境醫美市場擴張台廠。
- key: medical-devices
  name_zh: 醫療器材
  name_en: Medical Devices
  hint: 醫療器材與智慧醫療設備供應鏈（獨立於醫美主題），涵蓋診斷影像設備、居家照護器材、手術輔助器材與智慧醫療系統整合商。
- key: legacy-node-semiconductor
  name_zh: 成熟製程半導體
  name_en: Legacy-Node Semiconductor
  hint: 成熟／特殊製程晶圓代工與相關功率半導體，涵蓋PMIC、感測晶片、車用類比IC與8吋廠特殊製程代工廠，區別於先進製程主題。
- key: power-discrete-sic
  name_zh: 功率元件與碳化矽
  name_en: Power Discrete & SiC
  hint: 功率半導體與碳化矽（SiC）元件供應鏈，涵蓋SiC基板/晶圓、功率模組封裝、車用與工業用功率元件製造廠。
- key: ai-pc
  name_zh: AI PC
  name_en: AI PC
  hint: 搭載NPU的AI PC換機潮供應鏈（區別於AI伺服器主題，聚焦消費/商用個人電腦端），涵蓋筆記型電腦代工組裝、NPU晶片、記憶體模組與周邊散熱零組件廠。
- key: custom-asic-cloud
  name_zh: 雲端業者自研晶片
  name_en: Cloud ASIC / Custom Silicon
  hint: 美系雲端服務商（Google/Amazon/Microsoft/Meta等）自研AI加速晶片（ASIC）供應鏈（區別於輝達概念股主題），涵蓋ASIC設計服務、先進封裝整合與相關IP授權廠商。
- key: memory-supercycle
  name_zh: 記憶體漲價循環
  name_en: Memory Price Supercycle
  hint: DRAM／NAND Flash傳統記憶體現貨與合約漲價循環（獨立於HBM高頻寬記憶體主題），涵蓋記憶體模組廠、通路商與記憶體晶圓製造廠。
- key: abf-substrate
  name_zh: ABF載板
  name_en: ABF Substrate
  hint: 高階ABF封裝載板供需缺口與擴產題材，涵蓋載板三雄與相關銅箔基板、鑽孔設備供應商，區別於CoWoS先進封裝主題。
- key: passive-components
  name_zh: 被動元件
  name_en: Passive Components
  hint: 被動元件（MLCC、電阻、電感）漲價與AI伺服器需求拉貨題材，涵蓋被動元件製造大廠與其上游原材料供應商。
- key: naval-shipbuilding
  name_zh: 國艦國造
  name_en: Naval Shipbuilding
  hint: 國艦國造與軍用/商用造船產業鏈（獨立於既有軍工國防主題），涵蓋艦艇設計建造、船舶動力系統與船用零組件供應商。
- key: optical-network
  name_zh: 全光網路與光通訊
  name_en: All-Optical Network & Optical Communications
  hint: AI資料中心與電信網路的光纖傳輸基礎設施產業鏈（獨立於矽光子主題——矽光子聚焦晶片內／CPO封裝層級的光子整合，本主題聚焦網路傳輸層本身），涵蓋雷射與光偵測磊晶片、光收發模組（800G/1.6T）、光纖被動元件（耦合器、陣列）、DWDM/WDM光傳輸設備與海底/陸纜及電信網路系統整合廠。
