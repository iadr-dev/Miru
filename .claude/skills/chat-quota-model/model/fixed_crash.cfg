\* Fixed variant plus a crash after the claim: refunds cannot cover a dead process.
SPECIFICATION Spec
CONSTANTS
    Req = {1, 2, 3}
    Route <- RouteQuery3
    Key <- KeyDup3
    Cap = 1
    Days = 1
    FailAt = {"process_attachments", "resolve_thread", "patch_thread", "append_turn"}
    CrashIn = {"reserve", "post_claim"}
    RefundMode = "all"
    RefundDay = "claim"
    RowLock = TRUE
    UniqueKey = TRUE
    DupRefund = TRUE
    RefundStarted = FALSE
INVARIANTS TypeOK CapSafety NoLeak RejectOnlyWhenFull OneTurnPerKey
