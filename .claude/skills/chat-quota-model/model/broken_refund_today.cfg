\* Broken on purpose: the refund lands on the day it runs, not the claimed day (the code
\* before ChatClaim). Checks CapSafety only, so TLC shows the next-day overrun rather than
\* the shorter day-1 side effect. Must fail CapSafety (finding F5).
SPECIFICATION Spec
CONSTANTS
    Req = {1, 2, 3}
    Route <- RouteQuery3
    Key <- KeyDup3
    Cap = 1
    Days = 2
    FailAt = {}
    CrashIn = {}
    RefundMode = "dup_only"
    RefundDay = "now"
    RowLock = TRUE
    UniqueKey = TRUE
    DupRefund = TRUE
    RefundStarted = FALSE
INVARIANTS TypeOK CapSafety
