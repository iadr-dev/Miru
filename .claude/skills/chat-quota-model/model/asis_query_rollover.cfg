    Req = {1, 2, 3}
    Route <- RouteQuery3
    Key <- KeyDup3
    Cap = 1
    Days = 2
    FailAt = {"commit_gate_tx", "process_attachments", "resolve_thread", "patch_thread", "append_turn", "commit_turn"}
