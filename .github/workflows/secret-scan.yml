# Repo-wide secret scan — deliberately NOT path-filtered (unlike backend-ci/frontend-ci), since a
# leaked credential can land in either tree, docs, or config and must never go unscanned just
# because it fell outside whichever tree's own CI gate happened to be scoped to.
name: secret-scan

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    # The action calls GET /pulls/{n}/commits to scan the PR's diff — the repo's default
    # workflow token permissions alone weren't consistently granting that read, so it's
    # requested explicitly here rather than relying on the (mutable, repo-settings-controlled)
    # default.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
