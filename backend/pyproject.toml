[project]
name = "miru-backend"
version = "0.1.0"
description = "Governed, non-trading AI Taiwan-stock/ETF agent — backend"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "aiosqlite>=0.20",
  "asyncpg>=0.30",
  "duckdb>=1.1",
  "pandas>=2.2",
  "structlog>=24.4",
  "httpx>=0.27",
  "anyio>=4.6",
  "pyyaml>=6.0",
  "yfinance>=0.2.48",
  "anthropic>=0.120.2",
  "openai>=2.52.0",
  "google-genai>=2.16.0",
  "tiktoken>=0.13.0",
  "feedparser>=6.0.14",
  "selectolax>=0.4.11",
  "fastmcp>=3.4.5",
  "redis>=8.1.0",
  "holidays>=0.105",
  "pywebpush>=2.5.0",
]

[project.optional-dependencies]
# Real (non-stub) voice STT/TTS providers — heavy/network deps kept out of the base install;
# only pulled in when a deployment actually configures `voice_stt_provider`/`voice_tts_provider`
# to a non-"stub" value. `uv sync --extra voice` (or `--all-extras`) installs this group.
voice = [
  "faster-whisper>=1.0",
  "edge-tts>=6.1",
]
# Office/PDF -> Markdown text extraction for chat attachments (`api/routers/agent.py`'s
# `AttachmentInput`, `attachments/extractor.py`). Kept out of the base install like `voice`
# above — it pulls in a large converter dependency tree (python-docx/openpyxl/pdfminer/...)
# only a deployment that actually accepts document attachments needs.
attachments = [
  "markitdown[docx,pptx,xlsx,pdf]>=0.1.3",
]

[dependency-groups]
dev = [
  "ruff>=0.8",
  "pyright>=1.1.390",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "pre-commit>=4.0",
  "types-pyyaml>=6.0",
  "fakeredis>=2.37.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# No wrapper package — each backend/src/* module dir is imported as a flat top-level
# package (agent, tools, sources, ...).
packages = [
  "src/agent",
  "src/orchestrator",
  "src/llm",
  "src/tools",
  "src/dataaccess",
  "src/sources",
  "src/calendar",
  "src/ingest",
  "src/analytics",
  "src/context",
  "src/skills",
  "src/conversation",
  "src/memory",
  "src/events",
  "src/accounts",
  "src/payments",
  "src/feedback",
  "src/usage",
  "src/scheduler",
  "src/voice",
  "src/attachments",
  "src/personality",
  "src/pets",
  "src/schemas",
  "src/db",
  "src/api",
  "src/mcp",
  "src/config",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "TID", "PTH", "ASYNC", "RUF", "ANN", "T20", "S", "PL"]
ignore = [] # explicit Any ONLY where justified with a noqa + reason
# zh-TW-first product (personality fragments, pet persona hints, spoken-caveat text) — fullwidth
# CJK punctuation is correct typography, not a confusable to flag (RUF001/RUF002/RUF003).
allowed-confusables = ["，", "；", "：", "（", "）", "、", "。", "「", "」", "〇", "！", "？"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# One-way dependency rule: a layer may not import an upper layer;
# sources/* may not be imported outside dataaccess/ or ingest/.
"sources".msg = "sources/ is I/O-only — import via dataaccess/ or ingest/, never directly."

[tool.ruff.lint.per-file-ignores]
# asserts, loose typing, magic values OK in tests; tests/sources/** unit-test adapters
# directly (recorded fixtures, never live) so they're also allowed the sources/ import —
# production code outside dataaccess/ingest is still banned.
"tests/**" = ["S101", "S105", "S106", "S107", "S311", "ANN", "PLR2004", "TID251", "A005"]
# The only two callers permitted to import sources/ directly.
"src/dataaccess/**" = ["TID251"]
"src/ingest/**" = ["TID251"]
# Adapters importing sibling sources/* modules (e.g. sources/tls.py) is intra-layer, not a
# layering violation — the banned-import rule targets callers *outside* sources/.
"src/sources/**" = ["TID251"]
# Fixed package name — the events calendar, not stdlib calendar.
"src/calendar/**" = ["A005"]
# FastAPI's dependency-injection idiom is `Depends(...)` in a parameter default (B008) and
# request handlers/DI-seam factories naturally take many injected params (PLR0913/PLR0917) and
# an untyped `session` parameter FastAPI resolves (ANN001); cookie *names* trip the hardcoded-
# secret heuristics (S105/S106). These are framework conventions, not smells — scoped to api/.
"src/api/**" = ["B008", "PLR0913", "PLR0917", "ANN001", "S105", "S106"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src"]
# Resolve third-party imports (pydantic, sqlalchemy...) from the uv venv; without this a bare
# `pyright` run cannot find them and reports hundreds of phantom "unknown type" errors.
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
reportUnknownMemberType = "warning" # pandas/duckdb dynamic edges

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
disallow_any_explicit = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
  "duckdb.*",
  "yfinance.*",
  "FinMind.*",
  "pandas.*",
  "feedparser.*",
  "selectolax.*",
  "faster_whisper.*",
  "edge_tts.*",
  "markitdown.*",
  "pywebpush.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pydantic v2 + the pydantic.mypy plugin synthesize Any-typed code (model_config, BaseSettings
# init) at these seams; disallow_any_explicit false-positives on the class line itself.
# llm.base carries the same pydantic-model-field pattern (ToolCall.arguments: dict[str, object]
# etc.) as schemas/* — same false-positive, same scoped escape.
# context.* / calendar.* define their own frozen Pydantic models (CanonicalPackage,
# ConversationPackage, CalendarEvent, ...) with the same model_config synthesized-Any edge.
# tools.* is the same: every tool's input/output is a frozen Pydantic model.
# analytics.models / analytics.themes.models / analytics.screener.catalog define their own frozen
# Pydantic result models (ScoreResult, FactorScore, SmaResult, Theme, ThemeMember, SymbolTheme,
# TagDefinition, ...) with the identical model_config synthesized-Any edge. The screener funnel
# modules (gates/presets/factor_catalog/engine) do the same for their own frozen request/result
# models (GateDefaults, PresetCondition, FactorField, RunScreenerInput, ...).
# agent.* defines its own frozen Pydantic models (HookVerdict, CompactionEntry, Plan,
# ToolPlanStep) with the same model_config synthesized-Any edge. governance.textscan defines the
# same HookVerdict model (agent.guardrails re-exports it from there, see that module's docstring)
# — identical edge, one layer down.
# conversation.*/events.*/memory.*/skills.*/feedback.*/orchestrator.* define their own frozen
# Pydantic models (Message, Event, Memory, SkillFrontmatter, SkillProvenance, Routing,
# LaneResult, Finding, ...) with the identical model_config synthesized-Any edge.
# mcp.* subclasses fastmcp's own Pydantic-model Tool base (FastMCPTool) to project registry
# tools as MCP tools — the identical synthesized-Any edge, one layer removed (the third-party
# base class, not a model this project defines itself).
# accounts.*/personality.*/pets.*/voice.* (Phase 9) define their own frozen Pydantic models
# (User, EntitlementView, PersonalityPreset, OwnedPet, Transcript, ...) with the same
# model_config synthesized-Any edge.
# payments.* is the same: the Paddle webhook envelope + subscription entity are frozen Pydantic
# models over a provider payload whose dynamic fields (data, items, custom_data) are dict[str,
# Any] at the HTTP boundary — never let that Any cross into the normalized SubscriptionRecord.
module = [
  "schemas.*",
  "config.*",
  "llm.base",
  "context.*",
  "calendar.*",
  "tools.*",
  "analytics.models",
  "analytics.themes.models",
  "analytics.screener.catalog",
  "analytics.screener.gates",
  "analytics.screener.presets",
  "analytics.screener.factor_catalog",
  "analytics.screener.engine",
  "analytics.strategy_watch.strategies",
  "analytics.strategy_watch.intraday",
  "agent.*",
  "governance.*",
  "conversation.*",
  "events.*",
  "memory.*",
  "skills.*",
  "feedback.*",
  "orchestrator.*",
  "mcp.*",
  "accounts.*",
  "personality.*",
  "pets.*",
  "voice.*",
  "scheduler.*",
  "payments.*",
  "research.*",
  "usage.*",
  "api.*",
]
disallow_any_explicit = false

[[tool.mypy.overrides]]
# The `anthropic` SDK's `messages.create`/`.stream`/`.count_tokens` accept `**kwargs` built
# from a dynamically-assembled dict (system/tools/messages are optional per-call) — the SDK's
# own overload set can't be satisfied without an untyped kwargs edge. Isolated here; never let
# this Any cross into llm/base.py's normalized types.
module = ["llm.anthropic_client"]
disallow_any_explicit = false

[[tool.mypy.overrides]]
# The `openai` SDK's `chat.completions.create` accepts `**params` built from a dynamically-
# assembled dict (tools/stream/stream_options are optional per-call, mirroring the same
# overload-set edge as `llm.anthropic_client`) — isolated here.
module = ["llm.openai_client"]
disallow_any_explicit = false

[[tool.mypy.overrides]]
# The `google-genai` SDK's `types.Part`/`FunctionCall`/`FunctionResponse` carry `Any`-typed
# dynamic fields (`args: dict[str, Any] | None`, `response: dict[str, Any] | None`) with no
# narrower stub — isolated here; never let this Any cross into llm/base.py's normalized types.
module = ["llm.gemini_client"]
disallow_any_explicit = false

[[tool.mypy.overrides]]
# DBAPI connection object has no stable cross-driver type — isolate the unavoidable
# 3rd-party edge here rather than let Any cross the layer seam.
module = ["db.sqlite_pragma"]
disallow_any_explicit = false

[[tool.mypy.overrides]]
# yfinance's `Ticker.get_info()` returns a dynamically-shaped payload with no stable stub —
# isolate the unavoidable 3rd-party edge here, never let Any cross the sources/ layer seam
# into dataaccess/router.py's normalized SourceResult.payload.
module = ["sources.yfinance", "sources.yfinance.*"]
disallow_any_explicit = false

[[tool.mypy.overrides]]
# `batch_download` returns a raw yfinance/pandas MultiIndex DataFrame with no stable stub for
# its shape (same edge as sources.yfinance above, one layer up in ingest/) — isolated to the one
# row-mapper function that touches the raw frame; never let this Any cross into the flat
# `list[dict[str, object]]` rows `ParquetStore.write_partition` receives.
module = ["ingest.us_jobs"]
disallow_any_explicit = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# `pythonpath=["src"]` is inserted at sys.path[0] by pytest — required so the project's own
# `calendar/` package resolves before the stdlib `calendar` module, which otherwise wins by
# normal sys.path order (stdlib precedes the editable-install site-packages/.pth entry that
# exposes `src/`).
pythonpath = ["src"]
addopts = "-ra --strict-markers -m 'not network'"
markers = [
  "governance: highest-priority guardrail/entitlement suite",
  "network: hits real upstreams (opt-in only)",
  "operator_preflight: live source fetch (manual)",
  "browser_e2e: scraper live path (manual)",
  "concurrency: shared-state / race tests (Postgres+Redis)",
  "dual_dialect: must pass on SQLite AND Postgres",
]

[tool.coverage.run]
source = ["src"]
branch = false

[tool.coverage.report]
# Measured at 92.8% (2836 tests). The floor leaves room for a normal PR and fails a change that
# lands a large untested module. Enforced by `pytest --cov` (the weekly coverage workflow and any
# local run); the per-PR suite does not pay for tracing.
fail_under = 90
skip_covered = true
show_missing = true
