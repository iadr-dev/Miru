\* Broken on purpose: a turn whose answer streamed but could not be saved gives its unit
\* back. A user can make the save fail (delete the thread mid-turn). Must fail CapSafety.
SPECIFICATION Spec
CONSTANTS
    Req = {1, 2, 3}
    Route <- RouteQuery3
    Key <- KeyDup3
    Cap = 1
    Days = 1
    FailAt = {"save_answer"}
    CrashIn = {}
    RefundMode = "pre_start"
    RefundDay = "claim"
    RowLock = TRUE
    UniqueKey = TRUE
    DupRefund = TRUE
    GiveBackOn = {"save_failed", "run_failed"}
    SchedOrder = "check_first"
INVARIANTS TypeOK CapSafety NoLeak RejectOnlyWhenFull OneTurnPerKey
