\* Code as-is: UTC midnight passes during a same-key race. Checks CapSafety only, so TLC
\* shows the next-day overrun rather than the shorter day-1 side effect (see SKILL.md F5).
SPECIFICATION Spec
CONSTANTS
    Req = {1, 2, 3}
    Route <- RouteQuery3
    Key <- KeyDup3
    Cap = 1
    Days = 2
    FailAt = {}
    CrashIn = {}
    RefundMode = "as_is"
    RefundDay = "now"
    RowLock = TRUE
    UniqueKey = TRUE
    DupRefund = TRUE
    RefundStarted = FALSE
INVARIANTS TypeOK CapSafety
