\* Code, edit + regenerate + scheduled run: every pre-start step may fail and a started turn
\* may end any way, with a midnight rollover. Expected to pass.
SPECIFICATION Spec
CONSTANTS
    Req = {1, 2, 3}
    Route <- RouteOther3
    Key <- KeyNone3
    Cap = 1
    Days = 2
    FailAt = {"commit_gate_tx", "append_turn", "commit_turn", "daily_limit_check", "resolve_inputs", "claim_job", "commit_claim", "run_turn", "save_answer", "cancel"}
    CrashIn = {"reserve"}
    RefundMode = "pre_start"
    RefundDay = "claim"
    RowLock = TRUE
    UniqueKey = TRUE
    DupRefund = TRUE
    GiveBackOn = {"run_failed"}
    SchedOrder = "check_first"
INVARIANTS TypeOK CapSafety NoLeak RejectOnlyWhenFull OneTurnPerKey
