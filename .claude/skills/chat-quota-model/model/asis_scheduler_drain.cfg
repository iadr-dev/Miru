\* Code: a job past its daily_limit re-polls every minute, but checks the limit before the
\* gate, so it never reserves and the owner's own send is not locked out. Was finding F3.
\* Expected to pass.
SPECIFICATION Spec
CONSTANTS
    Req = {1, 2}
    Route <- RouteSched
    Key <- KeyNone2
    Cap = 2
    Days = 1
    FailAt = {"daily_limit_check"}
    CrashIn = {}
    RefundMode = "pre_start"
    RefundDay = "claim"
    RowLock = TRUE
    UniqueKey = TRUE
    DupRefund = TRUE
    GiveBackOn = {"run_failed"}
    SchedOrder = "check_first"
INVARIANTS TypeOK CapSafety NoLeak RejectOnlyWhenFull OneTurnPerKey
