# Gitleaks config for this repo — extends the default ruleset (no rules are weakened or
# disabled; only a specific, verified-safe false-positive pattern is allowlisted, scoped to the
# one file it occurs in, so a real secret elsewhere is still caught).
#
# False positive: analytics/screener/catalog.py's TagDefinition(key="...", ...) entries trip the
# built-in "generic-api-key" rule, since `key="<slug>"` with sufficient string entropy matches
# that rule's generic key=value heuristic. These are plain lowercase-snake-case catalog
# identifiers (e.g. `ma5_turning_down`), never a credential — verified by direct inspection of
# every match, and by the fact that a real key/token never takes this exact shape (real secrets
# are base64/hex/mixed-case, not a plain English snake_case phrase).
title = "miro gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[rules.allowlist]
paths = [
  '''backend/src/analytics/screener/catalog\.py''',
]
regexes = [
  '''^[a-z][a-z0-9_]*$''',
]
