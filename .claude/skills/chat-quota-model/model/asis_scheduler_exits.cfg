\* Code: a scheduled run's own checks (daily_limit, an empty watchlist) end it before
\* quota_gate.claim, so they reserve nothing; a claim_job lost after the claim gives the unit
\* back through the ChatClaim. Was finding F3. Expected to pass.
SPECIFICATION Spec
CONSTANTS
    Req = {1, 2}
    Route <- RouteSched
    Key <- KeyNone2
    Cap = 1
    Days = 1
    FailAt = {"daily_limit_check", "resolve_inputs", "claim_job"}
    CrashIn = {}
    RefundMode = "pre_start"
    RefundDay = "claim"
    RowLock = TRUE
    UniqueKey = TRUE
    DupRefund = TRUE
    GiveBackOn = {"run_failed"}
    SchedOrder = "check_first"
INVARIANTS TypeOK CapSafety NoLeak RejectOnlyWhenFull OneTurnPerKey
