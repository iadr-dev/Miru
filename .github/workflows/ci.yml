# PR gate for the Python backend. Gates run in blocking order: lint/format, then both type
# checkers, then the fast non-network suite, then the governance suite, then the dual-dialect
# Alembic check against a real Postgres service container. The default suite stays fast (no service
# container) — only the dual-dialect job pays for Postgres, so the common path isn't slowed by a DB
# it doesn't need.
name: backend-ci

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

env:
  # Pin to the 3.13 toolchain target (local dev is 3.14; C-extension wheels lag there).
  UV_PYTHON: "3.13"

jobs:
  lint-type-test:
    name: lint, types, fast + governance suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Sync dependencies (frozen)
        # NOSONAR (S8544/S8541) — `--frozen` already resolves strictly from the committed
        # `uv.lock`, and `--no-build` isn't viable: the project itself is an editable install
        # over `src/`, which requires a build step to register on every sync.
        run: uv sync --all-extras --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy (strict)
        run: uv run mypy src

      - name: pyright (strict)
        run: uv run pyright src

      - name: Default suite (non-network)
        run: uv run pytest

      - name: Governance suite
        run: uv run pytest -m governance

  dual-dialect-migrations:
    name: dual-dialect schema (SQLite + Postgres)
    runs-on: ubuntu-latest
    # Only this job needs a database. A Postgres service container gives `Base.metadata.
    # create_all()` (no Alembic migration chain — see db/base.py::ensure_schema) a real dialect
    # to run against, so "the schema is valid on Postgres too" is enforced, not assumed. The
    # SQLite half runs in-process and needs no service.
    #
    # Service containers start before any step runs, so the password can't come from a
    # step-generated secret — it's derived from the run id/sha instead of a literal string, so
    # there's no hardcoded password for a secret scanner to flag, even though this only ever
    # guards a same-job, network-isolated, torn-down-on-exit container with no real data in it.
    env:
      PGPASSWORD: ${{ github.run_id }}-${{ github.sha }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: miro
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.sha }}
          POSTGRES_DB: miro_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U miro -d miro_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Sync dependencies (frozen)
        # NOSONAR (S8544/S8541) — `--frozen` already resolves strictly from the committed
        # `uv.lock`, and `--no-build` isn't viable: the project itself is an editable install
        # over `src/`, which requires a build step to register on every sync.
        run: uv sync --all-extras --frozen

      - name: Dual-dialect migration suite
        # The dual-dialect test skips the Postgres half unless TEST_POSTGRES_URL is set; the
        # service container above uses the same run-derived password, so the check actually runs
        # in CI while a local `pytest` without a DB still passes.
        env:
          TEST_POSTGRES_URL: postgresql+asyncpg://miro:${{ env.PGPASSWORD }}@localhost:5432/miro_test
        run: uv run pytest -m dual_dialect -v

      - name: Concurrency suite (real Postgres)
        # Shared-state race proofs that only mean something against a store allowing concurrent
        # writers; reuses the same Postgres service, so it rides along with the dual-dialect job
        # rather than paying for a second container.
        env:
          TEST_POSTGRES_URL: postgresql+asyncpg://miro:${{ env.PGPASSWORD }}@localhost:5432/miro_test
        run: uv run pytest -m concurrency -v

  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    # The action calls GET /pulls/{n}/commits to scan the PR's diff — the repo's default
    # workflow token permissions alone weren't consistently granting that read, so it's
    # requested explicitly here rather than relying on the (mutable, repo-settings-controlled)
    # default.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
