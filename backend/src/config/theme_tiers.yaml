# config/theme_tiers.yaml — the curated editorial upstream/midstream/downstream map for a small
# set of major Taiwan industry themes. Curated rows always win over the keyword-heuristic
# classifier (analytics/themes/tiers.py), which backfills every (theme, sub_industry) pair this
# file does not name. Kept as data, not code, so an editor can revise the map without a deploy.
#
# Keyed by theme_key (the industry name, the same natural slug the Layer-1 industry-chain seed
# uses). sub_industry strings must match the values FinMind's industry-chain classification roster
# actually emits (e.g. 晶圓代工 / IC設計 / 連接器 as seen in the recorded fixtures) — a curated
# string that never appears in any membership simply never produces a row.
#
# Format:
#   <theme_key>:
#     upstream:   [sub_industry, ...]
#     midstream:  [sub_industry, ...]
#     downstream: [sub_industry, ...]
半導體:
  upstream: [晶圓代工, 矽智財, 光罩, 封測, 半導體材料, 半導體設備]
  midstream: [IC設計, 記憶體]
  downstream: [IC通路]
印刷電路板:
  upstream: [銅箔基板, PCB材料, PCB設備]
  midstream: [硬板, 軟板, 載板]
  downstream: [PCB通路]
人工智慧:
  upstream: [AI晶片, 高速傳輸介面]
  midstream: [AI伺服器, 散熱模組]
  downstream: [AI應用服務]
電動車:
  upstream: [電池芯, 電池材料, 車用半導體]
  midstream: [電池模組, 馬達, 充電樁]
  downstream: [整車, 車用電子系統]
交通運輸及航運:
  upstream: [造船]
  midstream: [貨櫃航運, 散裝航運, 空運]
  downstream: [物流服務, 港埠服務]
食品:
  upstream: [農產原料, 食品原料]
  midstream: [食品加工]
  downstream: [食品通路, 餐飲]
生技醫療:
  upstream: [原料藥, 生技耗材]
  midstream: [製劑, 醫材製造]
  downstream: [醫院, 藥品通路]
綠色能源:
  upstream: [太陽能電池, 風電零組件]
  midstream: [太陽能模組, 系統整合]
  downstream: [電廠營運, 售電服務]

# --- Remaining TWSE/TPEx industry categories below, added to extend curated coverage beyond the
# original 8 themes. `連接器` under 電子零組件 is the one string cross-checked against a recorded
# fixture/test sample; every other sub_industry string below is this editor's best-researched
# naming and is unverified against a real FinMind sample — treat as a starting point that may need
# adjustment once live industry-chain-classification data is checked.
電子零組件:
  upstream: [被動元件, 連接器, 電子材料]
  midstream: [電子零件模組, 精密機械零件]
  downstream: [電子零組件通路]
光電:
  upstream: [LED晶片, 光學材料]
  midstream: [LED封裝, 面板製造, 鏡頭模組]
  downstream: [光電應用產品]
通信網路:
  # 光通訊/全光網路 augmentation: researched as an active, distinct AI-datacenter-interconnect
  # narrative (800G/1.6T optical transceivers, DWDM, all-photonic network transport — see
  # concept_themes.yaml's `optical-network` entry), but it is a segment WITHIN this existing
  # 通信網路 industry bucket rather than its own FinMind top-level industry — a spot-checked optical
  # component maker (聯亞/3081) is reported as classified under 通信網路, not under 光電 or a
  # standalone optical-comm industry. `光通訊元件` / `光收發模組` / `光網路系統` below are this
  # editor's best-researched naming for that segment and are unverified against a real FinMind
  # sample — treat as a starting point that may need adjustment once live industry-chain
  # classification data is checked.
  upstream: [網通晶片, 天線元件, 光通訊元件]
  midstream: [路由器製造, 基地台設備, 光收發模組]
  downstream: [網通系統整合, 光網路系統]
電腦及週邊設備:
  upstream: [電腦零組件, 主機板材料]
  midstream: [桌上型電腦組裝, 筆記型電腦組裝, 週邊設備製造]
  downstream: [電腦通路]
# 其他電子 is TWSE's electronics catch-all (keyboards/calculators/niche makers) — no single
# coherent value chain, so this is a thin best-effort split rather than a confident one.
其他電子:
  upstream: [電子零件加工]
  midstream: [電子產品組裝]
  downstream: [電子產品通路]
# 資訊服務 is a software/services industry with no physical-materials chain — the tiers below are
# a service-layering analogy (infra → build → deliver), not a true supply chain.
資訊服務:
  upstream: [雲端運算基礎設施]
  midstream: [軟體開發, 系統整合服務]
  downstream: [資訊服務通路]
# 電子通路 is itself a distribution business — every sub-industry here is inherently closer to
# "downstream" by nature; the split below is thin (upstream/midstream distinguish only by how
# close to the original manufacturer the trading tier sits).
電子通路:
  upstream: [電子零組件代理]
  midstream: [電子零組件經銷]
  downstream: [電子商務通路]
鋼鐵:
  upstream: [鐵礦砂, 廢鋼回收]
  midstream: [煉鋼, 鋼品軋延]
  downstream: [鋼鐵通路, 鋼結構工程]
紡織纖維:
  upstream: [化纖原料, 紗線]
  midstream: [織布, 染整]
  downstream: [成衣, 紡織品通路]
橡膠:
  upstream: [橡膠原料]
  midstream: [輪胎製造, 工業橡膠製品]
  downstream: [橡膠製品通路]
水泥:
  upstream: [石灰石礦, 水泥原料]
  midstream: [水泥製造]
  downstream: [預拌混凝土, 水泥通路]
造紙:
  upstream: [紙漿]
  midstream: [造紙製造]
  downstream: [紙製品加工, 紙業通路]
化學:
  upstream: [石化原料, 基礎化學品]
  midstream: [特用化學品, 化學材料加工]
  downstream: [化工產品通路]
塑膠:
  upstream: [塑膠原料]
  midstream: [塑膠加工, 塑膠製品製造]
  downstream: [塑膠製品通路]
油電燃氣:
  upstream: [石油煉製, 天然氣供應]
  midstream: [電力供應, 燃氣配送]
  downstream: [加油站通路, 用戶端服務]
建材營造:
  upstream: [營建原料]
  midstream: [營造工程]
  downstream: [不動產開發, 建材通路]
# 觀光餐旅 is a hospitality/services industry with no materials chain — the split below only
# loosely maps onto upstream/midstream/downstream (input services → operation → retail/booking).
觀光餐旅:
  upstream: [旅運服務]
  midstream: [飯店餐飲服務]
  downstream: [旅行社, 觀光零售]
# 貿易百貨 (trading houses / department stores) is inherently retail/distribution-heavy — the
# split below is thin, distinguishing only how far a segment sits from the end consumer.
貿易百貨:
  upstream: [進口貿易]
  midstream: [批發代理]
  downstream: [百貨零售, 電商零售]
汽車:
  upstream: [汽車零組件, 車用鋼材]
  midstream: [汽車製造, 車體組裝]
  downstream: [汽車經銷, 汽車零件通路]
電機機械:
  upstream: [機械零組件, 金屬加工]
  midstream: [工業機械製造, 電機設備製造]
  downstream: [機械設備通路, 系統整合工程]
電器電纜:
  upstream: [電線電纜原料]
  midstream: [電線電纜製造]
  downstream: [電力工程, 電材通路]
玻璃陶瓷:
  upstream: [矽砂, 陶瓷原料]
  midstream: [玻璃製造, 陶瓷製造]
  downstream: [玻璃陶瓷製品通路]
數位雲端:
  upstream: [資料中心硬體]
  midstream: [雲端服務平台, 資安服務]
  downstream: [SaaS應用服務]
運動休閒:
  upstream: [運動用品原料]
  midstream: [運動用品製造]
  downstream: [運動用品通路, 健身服務]
居家生活:
  upstream: [家具原料]
  midstream: [家具製造, 生活用品製造]
  downstream: [居家生活用品通路]

# NOT covered above, by design:
# - 金融保險 (banks/insurers/securities firms) has no upstream/midstream/downstream materials or
#   production chain at all — a bank's "supply chain" framing would be fabricated, so it is
#   deliberately left for the heuristic backfill rather than force-fit here.
# - 其他業 is TWSE's pure catch-all bucket for firms that fit no other category — by construction
#   it has no coherent shared value chain, so it is left uncurated for the same reason.
