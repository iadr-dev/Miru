\* Code: a started turn ends with an answer, a cancel, a failed save, or a failed run, with a
\* midnight rollover. Only the failed run gives its unit back, to the day it was claimed on.
\* Expected to pass.
SPECIFICATION Spec
CONSTANTS
    Req = {1, 2, 3}
    Route <- RouteQuery3
    Key <- KeyDup3
    Cap = 1
    Days = 2
    FailAt = {"run_turn", "save_answer", "cancel"}
    CrashIn = {}
    RefundMode = "pre_start"
    RefundDay = "claim"
    RowLock = TRUE
    UniqueKey = TRUE
    DupRefund = TRUE
    GiveBackOn = {"run_failed"}
    SchedOrder = "check_first"
INVARIANTS TypeOK CapSafety NoLeak RejectOnlyWhenFull OneTurnPerKey
