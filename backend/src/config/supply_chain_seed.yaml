# config/supply_chain_seed.yaml — a small bootstrap set of well-known, publicly-documented
# Taiwan/global supply-chain relationships. Loaded once (idempotently, replace-per-source) into
# `supply_chain_edges` with source='seed', so the edge graph is never empty before the LLM
# in-theme edge generator runs. These are established facts (a listed Taiwan supplier and its
# well-known global customer), not speculation.
#
# `revenue_pct` is the customer's approximate share of the supplier's revenue where it is a
# broadly-reported figure; left null where no stable public number exists — an absent number is
# honest, a fabricated one is not.
#
# edge_type semantics: 'supplies' = from_symbol supplies to_symbol; 'customer' = to_symbol is a
# customer of from_symbol (kept distinct so direction is explicit); 'competes' = rivalry.
# confidence is a provenance band: 'high' for a widely-reported relationship.
#
# Format:
#   - from_symbol / to_symbol / from_name / to_name / edge_type / confidence / revenue_pct
