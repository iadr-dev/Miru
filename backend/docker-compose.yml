# Dev-parity stack: the full runtime graph on one host so the Redis-transport path (cross-worker
# SSE fan-out, quota counters, locks) is exercised locally against a real Redis + Postgres, not
# first discovered in prod. One image, role-selected per service via SERVICE_ROLE.
#
# Secrets are never baked in: credential-shaped values read from the shell/.env via ${VAR}
# interpolation with dev-only fallbacks for the non-secret infra wiring. Provider API keys are
# passed through from the environment (unset = that provider simply degrades, per its adapter).
#
# Deliberately explicit per-var, not `env_file: .env` — .env also carries the *host*-side
# DATABASE_URL/REDIS_URL etc. that would collide with this file's own service-hostname wiring
# (postgres/redis, not localhost) if loaded wholesale. Consequence: every new `config/settings.py`
# field that must reach a container needs a matching line below — Settings.() silently returns
# None for anything missing here, so a forgotten var degrades quietly (e.g. OAuth 503s
# `provider_unconfigured` even with real credentials in .env) rather than erroring at startup.

name: miru

x-app-env: &app-env
  # App state on the compose Postgres; async driver required.
  # `DB_USER=miru_app` (created by docker/postgres-init on a fresh volume) is the ordinary role row-level
  # security needs; the default `miru` is the container superuser, which Postgres exempts from RLS.
  DATABASE_URL: postgresql+asyncpg://${DB_USER:-miru}:${POSTGRES_PASSWORD:-dev-only-not-a-real-secret-change-me}@postgres:5432/miru
  ROW_LEVEL_SECURITY: ${ROW_LEVEL_SECURITY:-false}
  # The whole point of the dev-parity stack: real Redis, real Redis-backed transport + limiter,
  # so the code paths that only activate on the redis backend actually run here.
  REDIS_URL: redis://redis:6379/0
  EVENT_BUS_BACKEND: redis
  RATE_LIMITER_BACKEND: redis
  REDIS_REQUEST_TIMEOUT_SECONDS: ${REDIS_REQUEST_TIMEOUT_SECONDS:-2}
  SHUTDOWN_GRACE_SECONDS: ${SHUTDOWN_GRACE_SECONDS:-30}
  REDIS_REQUEST_MAX_CONNECTIONS: ${REDIS_REQUEST_MAX_CONNECTIONS:-50}
  # FinMind token cap shared by api + ingest (calls per window); ingest uses at most its share.
  FINMIND_CALLS_PER_WINDOW: ${FINMIND_CALLS_PER_WINDOW:-6000}
  FINMIND_CALL_WINDOW_SECONDS: ${FINMIND_CALL_WINDOW_SECONDS:-3600}
  FINMIND_INGEST_SHARE: ${FINMIND_INGEST_SHARE:-0.5}
  FINMIND_QUOTA_KEY_PREFIX: ${FINMIND_QUOTA_KEY_PREFIX:-finmind:calls}
  # How the ingest process binds its real `data.updated` publisher (ingest/ may not import events/,
  # so it resolves this "module:callable" by name — ingest/publisher_binding.py). The default IS the
  # real factory on purpose: the usual `${VAR:-}` would forward an EMPTY string when unset, and an
  # empty value disables binding. Set it to an empty string explicitly to keep the no-op.
  INGEST_DATA_UPDATE_PUBLISHER_FACTORY: ${INGEST_DATA_UPDATE_PUBLISHER_FACTORY:-events.ingest_wiring:build_data_update_publisher}
  # Derived-store dirs on the shared named volume (leader writes Parquet, readers read it).
  DUCKDB_PATH: /app/data/duckdb
  PARQUET_ROOT: /app/data/parquet
  ENV: development
  # Dev-only startup gap-fill (ingest/__main__.py's `_startup_gap_fill`, docs/backend/
  # modules/22-data-ingest.md §6a). Defaults to OFF: an unattended `docker compose up`/
  # `dev-backend.sh` restart should never silently kick off a multi-year backfill sweep (it
  # previously did, and starved the `api` container's CPU/RAM on a shared dev host for minutes).
  # Seed data explicitly via `dev-backend.sh --backfill` (`run_backfill_cli`) instead — an
  # operator-visible, one-time action, not a hidden side effect of every restart. Set
  # `INGEST_ON_STARTUP=true` in the shell/.env to opt back into auto-catch-up.
  # `run_backfill_cli` hard-refuses regardless of this flag when `ENV=production`, so this
  # default is safe even if a prod compose file forgot to override it.
  INGEST_ON_STARTUP: ${INGEST_ON_STARTUP:-false}
  # A dev JWT secret so auth-required routes work locally; override via the shell for anything real.
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-not-a-real-secret-change-me}
  # OAuth sign-in (auth.py) — unset = that provider's begin-flow 503s `provider_unconfigured`
  # rather than silently no-op'ing, so a missing credential is loud, not a quiet dead button.
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
  LINE_CHANNEL_ID: ${LINE_CHANNEL_ID:-}
  LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-}
  LINE_REDIRECT_URI: ${LINE_REDIRECT_URI:-}
  TELEGRAM_LOGIN_CLIENT_ID: ${TELEGRAM_LOGIN_CLIENT_ID:-}
  TELEGRAM_LOGIN_CLIENT_SECRET: ${TELEGRAM_LOGIN_CLIENT_SECRET:-}
  TELEGRAM_LOGIN_REDIRECT_URI: ${TELEGRAM_LOGIN_REDIRECT_URI:-}
  # Where the OAuth callback 302s the browser after establishing (or failing to establish) a
  # session — the web app's origin, not this backend's.
  FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
  # LLM / data-provider keys pass through from the host env; unset = that provider degrades.
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  FINMIND_API_KEY: ${FINMIND_API_KEY:-}
  BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
  FINNHUB_KEY: ${FINNHUB_KEY:-}
  FINMIND_BASE_URL: ${FINMIND_BASE_URL:-https://api.finmindtrade.com/api/v4}
  # Point the offline path at the compose Ollama service when the `ollama` profile is up.
  OLLAMA_BASE_URL: http://ollama:11434
  # LLM role/provider overrides — unset = config/settings.py's own per-role defaults apply.
  LLM_PROVIDER: ${LLM_PROVIDER:-}
  LLM_MODEL: ${LLM_MODEL:-}
  MODEL_ROLE_CLASSIFIER: ${MODEL_ROLE_CLASSIFIER:-}
  MODEL_ROLE_AGENT: ${MODEL_ROLE_AGENT:-}
  MODEL_ROLE_SUBAGENT: ${MODEL_ROLE_SUBAGENT:-}
  MODEL_ROLE_SYNTHESIS: ${MODEL_ROLE_SYNTHESIS:-}
  CONTEXT_WINDOW_TOKENS: ${CONTEXT_WINDOW_TOKENS:-128000}
  CONTEXT_RESERVE_TOKENS: ${CONTEXT_RESERVE_TOKENS:-4000}
  AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-8}
  LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-16000}
  ORCH_MAX_SUBAGENTS: ${ORCH_MAX_SUBAGENTS:-4}
  ORCH_MAX_STEPS_PER_AGENT: ${ORCH_MAX_STEPS_PER_AGENT:-8}
  ORCH_MAX_TOOL_CALLS_PER_TURN: ${ORCH_MAX_TOOL_CALLS_PER_TURN:-40}
  ORCH_MAX_COST_MICROS_PER_TURN: ${ORCH_MAX_COST_MICROS_PER_TURN:-5000000}
  ORCH_MAX_TOKENS_PER_TURN: ${ORCH_MAX_TOKENS_PER_TURN:-1000000}
  # JWT tuning — the secret above is the load-bearing one; these three rarely need overriding.
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-15}
  JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-30}
  # BYOK/channel-token envelope encryption — unset = the secret store refuses to persist (fails
  # loud rather than storing a key in plaintext); generate a real key for BYOK to work locally.
  SECRET_ENCRYPTION_KEYS: ${SECRET_ENCRYPTION_KEYS:-}
  # CORS + MCP network hardening — empty = no CORS layer / no allow-list installed (dev-permissive
  # defaults from config/settings.py); set for anything simulating a real browser origin.
  # Empty = no CORS middleware installed at all (api/app.py) — the browser then blocks every
  # cross-origin fetch from the frontend dev server as an opaque network failure (this is the
  # actual cause behind a frontend "couldn't reach the sign-in service" error, not a backend
  # outage). Default to the frontend dev server's origin so the dev-parity stack works out of
  # the box; override for a frontend running anywhere else.
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
  MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
  MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
  MCP_HOST: ${MCP_HOST:-0.0.0.0}
  MCP_PORT: ${MCP_PORT:-8100}
  WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL:-http://localhost:8000}
  # strict|compatibility|unsafe-explicit — never silently downgraded (sources/tls.py, governance).
  TLS_POLICY: ${TLS_POLICY:-strict}
  # Ingest/scheduler cadence + FinMind Sponsor-pool budget — safe defaults, override to shorten
  # loops while iterating on either.
  DEV_BACKFILL_YEARS: ${DEV_BACKFILL_YEARS:-3}
  INGEST_POLL_INTERVAL_SECONDS: ${INGEST_POLL_INTERVAL_SECONDS:-60}
  SCHEDULER_POLL_INTERVAL_SECONDS: ${SCHEDULER_POLL_INTERVAL_SECONDS:-60}
  RATE_LIMIT_KEY_PREFIX: ${RATE_LIMIT_KEY_PREFIX:-ratelimit}
  LOG_FORMAT: ${LOG_FORMAT:-auto}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  SCHEMA_UPGRADE_MODE: ${SCHEMA_UPGRADE_MODE:-strict}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
  DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-1800}
  DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-30000}
  DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-10}
  DB_IDLE_IN_TRANSACTION_TIMEOUT_MS: ${DB_IDLE_IN_TRANSACTION_TIMEOUT_MS:-300000}
  TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-0}
  FINMIND_POOL_KEY_PREFIX: ${FINMIND_POOL_KEY_PREFIX:-finmind:pool}
  FINMIND_POOL_LIMIT_PER_WINDOW: ${FINMIND_POOL_LIMIT_PER_WINDOW:-6000}
  FINMIND_POOL_WINDOW_SECONDS: ${FINMIND_POOL_WINDOW_SECONDS:-3600}
  FINMIND_RESERVE_PER_LANE: ${FINMIND_RESERVE_PER_LANE:-1}
  DATA_UPDATED_KEY_PREFIX: ${DATA_UPDATED_KEY_PREFIX:-data.updated}
  # Market-data cache tier (module 16 §3/§4) — the dev-parity stack turns the read-through Redis
  # cache on so the single-flight/TTL-by-timing_class paths actually run here, matching real Redis
  # transport for everything else in this compose file.
  MARKET_DATA_CACHE_BACKEND: ${MARKET_DATA_CACHE_BACKEND:-redis}
  MARKET_DATA_CACHE_KEY_PREFIX: ${MARKET_DATA_CACHE_KEY_PREFIX:-marketdata:cache}
  MARKET_DATA_CACHE_TTL_REFERENCE_SECONDS: ${MARKET_DATA_CACHE_TTL_REFERENCE_SECONDS:-300}
  MARKET_DATA_CACHE_TTL_LIVE_ISH_SECONDS: ${MARKET_DATA_CACHE_TTL_LIVE_ISH_SECONDS:-5}
  MARKET_DATA_CACHE_TTL_OFFICIAL_EOD_SECONDS: ${MARKET_DATA_CACHE_TTL_OFFICIAL_EOD_SECONDS:-43200}
  MARKET_DATA_CACHE_TTL_EVENT_DRIVEN_SECONDS: ${MARKET_DATA_CACHE_TTL_EVENT_DRIVEN_SECONDS:-300}
  MARKET_DATA_CACHE_TTL_FAILURE_SECONDS: ${MARKET_DATA_CACHE_TTL_FAILURE_SECONDS:-30}
  # Live-quote poller tuning (module 16 §2a) — safe defaults.
  QUOTE_POLL_CADENCE_NORMAL_SECONDS: ${QUOTE_POLL_CADENCE_NORMAL_SECONDS:-5}
  QUOTE_POLL_CADENCE_SAVER_SECONDS: ${QUOTE_POLL_CADENCE_SAVER_SECONDS:-20}
  QUOTE_STREAM_MAX_SYMBOLS_PER_CONNECTION: ${QUOTE_STREAM_MAX_SYMBOLS_PER_CONNECTION:-50}
  QUOTE_STREAM_MAX_DEMANDED_SYMBOLS: ${QUOTE_STREAM_MAX_DEMANDED_SYMBOLS:-500}
  QUOTE_CHANNEL_KEY_PREFIX: ${QUOTE_CHANNEL_KEY_PREFIX:-quote}
  QUOTE_DEMAND_KEY_PREFIX: ${QUOTE_DEMAND_KEY_PREFIX:-demand}
  # yfinance's tz cache — writable/persistent path inside the container.
  YF_TZ_CACHE_DIR: ${YF_TZ_CACHE_DIR:-./.cache/yf_tz}
  # Voice (module: voice/providers.py) — STT defaults to "faster_whisper" (real, local, no key
  # needed); TTS defaults to "edge_tts" (real, free, no key needed) — both matching Settings'
  # own defaults. "openai" is a paid opt-in for either. Compose does not read `.env` wholesale
  # (see this file's header comment), so these fallbacks must be kept in sync with
  # `config/settings.py`'s own defaults by hand.
  VOICE_STT_PROVIDER: ${VOICE_STT_PROVIDER:-faster_whisper}
  VOICE_TTS_PROVIDER: ${VOICE_TTS_PROVIDER:-edge_tts}
  # Chat attachments (module: attachments/, api/attachments.py) — image/document upload cap.
  MAX_ATTACHMENT_SIZE_BYTES: ${MAX_ATTACHMENT_SIZE_BYTES:-15000000}
  # Paddle billing (module 15) — unset = /billing/* 503s `billing_unconfigured`.
  PADDLE_API_KEY: ${PADDLE_API_KEY:-}
  PADDLE_WEBHOOK_SECRET: ${PADDLE_WEBHOOK_SECRET:-}
  PADDLE_CLIENT_TOKEN: ${PADDLE_CLIENT_TOKEN:-}
  PADDLE_ENVIRONMENT: ${PADDLE_ENVIRONMENT:-sandbox}
  PADDLE_PRICE_PREMIUM_MONTHLY: ${PADDLE_PRICE_PREMIUM_MONTHLY:-}
  PADDLE_PRICE_PREMIUM_ANNUAL: ${PADDLE_PRICE_PREMIUM_ANNUAL:-}
  PADDLE_PRICE_PREMIUM_BYOK_MONTHLY: ${PADDLE_PRICE_PREMIUM_BYOK_MONTHLY:-}
  PADDLE_PRICE_PREMIUM_BYOK_ANNUAL: ${PADDLE_PRICE_PREMIUM_BYOK_ANNUAL:-}
  PADDLE_PRICE_PRO_MONTHLY: ${PADDLE_PRICE_PRO_MONTHLY:-}
  PADDLE_PRICE_PRO_ANNUAL: ${PADDLE_PRICE_PRO_ANNUAL:-}
  PADDLE_PRICE_PRO_BYOK_MONTHLY: ${PADDLE_PRICE_PRO_BYOK_MONTHLY:-}
  PADDLE_PRICE_PRO_BYOK_ANNUAL: ${PADDLE_PRICE_PRO_BYOK_ANNUAL:-}
  # Notification channels (module 14 delivery/channels.py) — each degrades to a shaped no-network
  # stub without credentials (only in_app truly delivers regardless).
  # The example names it CHANNEL_ACCESS_TOKEN; older .env files used MESSAGING_ACCESS_TOKEN.
  LINE_MESSAGING_CHANNEL_ACCESS_TOKEN: ${LINE_MESSAGING_CHANNEL_ACCESS_TOKEN:-${LINE_MESSAGING_ACCESS_TOKEN:-}}
  LINE_BOT_BASIC_ID: ${LINE_BOT_BASIC_ID:-}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:noreply@miru.app}
  LINE_MESSAGING_CHANNEL_SECRET: ${LINE_MESSAGING_CHANNEL_SECRET:-}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
  TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
  EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
  APNS_KEY_ID: ${APNS_KEY_ID:-}
  APNS_TEAM_ID: ${APNS_TEAM_ID:-}
  APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-}
  APNS_AUTH_KEY: ${APNS_AUTH_KEY:-}
  FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
  FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}

services:
  postgres:
    image: postgres:17-alpine
    # Come back after Docker Desktop restarts, the machine sleeps or reboots, or the process dies.
    # Without this a stopped stack stays down until someone notices (the schedule was once down
    # for 22 hours). `unless-stopped`: a service stopped on purpose (`docker compose stop`) stays
    # stopped.
    restart: unless-stopped
    environment:
      POSTGRES_USER: miru
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-not-a-real-secret-change-me}
      POSTGRES_DB: miru
    # Published to the host so a bare `uv run` process (no Docker) can also reach the same
    # Postgres data as the containerized api/scheduler/ingest/mcp services — dev-only convenience,
    # not something a prod deployment would do.
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miru -d miru"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF on: quota counters + idempotency locks must survive a restart so a flush can't cause
    # double-billing / double-delivery (cache keys are ephemeral and don't rely on this).
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: miru-backend
    restart: unless-stopped
    environment:
      <<: *app-env
      SERVICE_ROLE: api
    # Longer than SHUTDOWN_GRACE_SECONDS: a stop lets chat turns in flight finish first.
    stop_grace_period: 45s
    ports:
      - "8000:8000"
    volumes:
      - marketdata:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Readiness probe verifies Postgres + Redis reachability (not just process-up), matching what
      # a real load balancer would gate traffic on.
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/readyz').status==200 else 1)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: miru-backend
    environment:
      <<: *app-env
      SERVICE_ROLE: scheduler
    restart: unless-stopped
    # One replica here. The process takes the `scheduler` lease (a Postgres advisory lock), so a
    # second replica would stand by rather than run jobs twice.
    # On a stop, a pass already running gets this long to finish. Anything longer is killed, which
    # is safe: a job is claimed atomically and every notification is recorded before it is sent.
    stop_grace_period: 30s
    volumes:
      - marketdata:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ingest:
    build:
      context: .
      dockerfile: Dockerfile
    image: miru-backend
    environment:
      <<: *app-env
      SERVICE_ROLE: ingest
    restart: unless-stopped
    # One replica here. The daemon holds the `ingest-writer` lease for as long as it runs, so a
    # second replica, or a backfill started next to it, stands by or exits (status 3) rather than
    # write alongside it. `scripts/dev-backend.sh --backfill` stops this service for the run.
    # A whole-market job can take minutes, so a stop does not wait for it: after this grace period
    # it is killed, which is safe because a partition only becomes visible by an atomic swap, and
    # the startup gap-fill redoes whatever was cut short.
    stop_grace_period: 30s
    volumes:
      - marketdata:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: miru-backend
    restart: unless-stopped
    stop_grace_period: 45s
    environment:
      <<: *app-env
      SERVICE_ROLE: mcp
      MCP_HOST: ${MCP_HOST:-0.0.0.0}
      MCP_PORT: ${MCP_PORT:-8100}
    ports:
      - "8100:8100"
    # The MCP tool registry is built the same way the API's is (`orchestrator.composition.
    # build_tool_registry`) — it wires a `market_data_reader` over the Parquet store (the
    # screener/theme tools read it) and a `session_factory` against the compose Postgres, so
    # this role needs the same derived-store volume and the same readiness ordering as api/
    # scheduler/ingest.
    volumes:
      - marketdata:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # mcp/app.py registers a plain liveness route separate from the /mcp protocol endpoint
      # (which requires standing up a full MCP session to probe) — verified live against a real
      # container: returns 200 {"status": "ok"} once the ASGI app has started.
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8100/healthz').status==200 else 1)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # Offline / self-host inference path — NOT in the hosted prod image. Disabled by default; bring it
  # up with `--profile ollama` when running the local LLM stack.
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama

volumes:
  pgdata:
  redisdata:
  marketdata:
  ollamadata:
