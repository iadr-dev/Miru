\* Code as-is: a job past its own daily_limit re-polls and re-reserves; shows the user-visible lockout only.
SPECIFICATION Spec
CONSTANTS
    Req = {1, 2}
    Route <- RouteSched
    Key <- KeyNone2
    Cap = 2
    Days = 1
    FailAt = {"daily_limit_check"}
    CrashIn = {}
    RefundMode = "as_is"
    RefundDay = "now"
    RowLock = TRUE
    UniqueKey = TRUE
    DupRefund = TRUE
    RefundStarted = FALSE
INVARIANTS TypeOK RejectOnlyWhenFull
